spring.application.name=Car Service Management System

# ======================================================
# DATABASE CONFIGURATION
# ======================================================
# Connect to MySQL database. Make sure MySQL is running locally.
# createDatabaseIfNotExist=true  --> auto-creates the DB if missing
spring.datasource.url=jdbc:mysql://localhost:3306/car_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

# ======================================================
# JPA / HIBERNATE CONFIGURATION
# ======================================================
# ddl-auto=update --> Hibernate updates the schema automatically based on entity classes
# Use 'create' to drop + recreate tables on startup (CAUTION: deletes data)
# Use 'validate' in production to only check schema, not modify it
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console — useful for learning and debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ======================================================
# SERVER CONFIGURATION
# ======================================================
# Application runs on http://localhost:8080
server.port=8080

# Error response settings — show messages but not full stack traces
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=always
